<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple 3D Minecraft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}
#loadingScreen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#16213e;color:#fff;text-align:center}
.loading-title{font-size:42px;color:#0f0;margin-bottom:24px}.bar{width:320px;height:24px;background:#222;border:2px solid #0f0;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#0f0,#0a0)}#loadingText{margin-top:12px;font-size:16px}#loadingPercent{margin-top:8px;font-size:18px;color:#0f0;font-weight:700}
#hud{position:fixed;top:10px;left:10px;z-index:2;padding:10px;color:#fff;background:#0008;font:14px monospace;line-height:1.5}#hud b{color:#ff0}
#inventory{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(9,52px);gap:6px;padding:10px;background:#0008;border:2px solid #6a6a6a;border-radius:8px;z-index:2}
.slot{appearance:none;border:2px solid #444;background:#777;width:52px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:#fff;font-weight:700;border-radius:4px}
.slot.selected{border-color:#ffd700;box-shadow:0 0 10px #ffd700;background:#a3a3a3}.slot .color{position:absolute;inset:7px 7px 18px 7px;border-radius:4px}.slot .name{position:absolute;bottom:4px;left:0;right:0;font-size:9px;text-align:center}.slot .key{position:absolute;top:4px;right:5px;font-size:8px;color:#ddd}
#selectedInfo{position:fixed;top:10px;right:10px;z-index:2;padding:10px 12px;background:#0008;border:2px solid #0f0;border-radius:8px;color:#0f0;font:14px monospace;text-align:center}
#selectedSwatch{width:48px;height:48px;border:2px solid #0f0;border-radius:6px;margin:8px auto;background:#2d5016}
#selectedName{font-size:16px;margin-top:8px}
.crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;width:20px;height:20px;border:2px solid rgba(255,255,255,0.5)}
.crosshair::before{content:'';position:absolute;width:2px;height:6px;background:rgba(255,255,255,0.5);top:-8px;left:50%;transform:translateX(-50%)}
.crosshair::after{content:'';position:absolute;width:2px;height:6px;background:rgba(255,255,255,0.5);bottom:-8px;left:50%;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="loadingScreen"><div><div class="loading-title">🎮 MINECRAFT 3D</div><div class="bar"><div id="loadingBar"></div></div><div id="loadingText">Starting 3D engine...</div><div id="loadingPercent">0%</div></div></div>
<canvas id="gameCanvas"></canvas>
<div class="crosshair"></div>
<div id="hud">WASD: move | Space: jump<br>Click: place | Shift: remove<br>Selected: <b id="selectedNameHUD">Grass</b><br>FPS: <span id="fps">0</span> | Chunks: <span id="chunks">0</span></div>
<div id="selectedInfo"><div>Selected</div><div id="selectedSwatch"></div><div id="selectedName">Grass</div></div>
<div id="inventory"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
function load(n,t){$('loadingBar').style.width=n+'%';$('loadingPercent').textContent=n+'%';$('loadingText').textContent=t}

load(10,'Setting up canvas...');
const canvas=$('gameCanvas');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,150,300);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.y=32;

const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(1);

load(20,'Adding lights...');
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.5);
sun.position.set(100,150,100);
scene.add(sun);

load(30,'Creating blocks...');
const blockTypes=[
 {name:'Grass',color:0x2d5016},
 {name:'Dirt',color:0x8b5a35},
 {name:'Stone',color:0x808080},
 {name:'Sand',color:0xe6c27a},
 {name:'Wood',color:0x79502b},
 {name:'Leaves',color:0x258a35},
 {name:'Glass',color:0xadd8e6},
 {name:'Cobble',color:0x6b6b6b},
 {name:'Coal',color:0x1a1a1a}
];

let selectedBlock=0;
const inventory=$('inventory');
blockTypes.forEach((t,i)=>{
 const btn=document.createElement('button');
 btn.className='slot'+(i===0?' selected':'');
 btn.innerHTML='<span class="color" style="background:#'+t.color.toString(16).padStart(6,'0')+'"></span><span class="name">'+t.name+'</span><span class="key">'+(i+1)+'</span>';
 btn.onclick=()=>selectBlock(i);
 inventory.appendChild(btn);
});

function selectBlock(i){
 selectedBlock=i;
 document.querySelectorAll('.slot').forEach((s,idx)=>s.classList.toggle('selected',idx===i));
 const t=blockTypes[selectedBlock];
 $('selectedSwatch').style.background='#'+t.color.toString(16).padStart(6,'0');
 $('selectedName').textContent=t.name;
 $('selectedNameHUD').textContent=t.name;
}

load(40,'Building world...');

// Minecraft-style chunks: 16x16x4
const CHUNK_SIZE=16;
const WORLD_HEIGHT=4;
const RENDER_DIST=3;

const blockMap=new Map();
const chunkMeshes=new Map();

function blockKey(x,y,z){return x+','+y+','+z}
function chunkKey(cx,cz){return cx+','+cz}

function getChunkCoords(x,z){
 return {cx:Math.floor(x/CHUNK_SIZE),cz:Math.floor(z/CHUNK_SIZE)};
}

// Generate initial flat world
for(let cx=-RENDER_DIST;cx<=RENDER_DIST;cx++){
 for(let cz=-RENDER_DIST;cz<=RENDER_DIST;cz++){
  for(let x=0;x<CHUNK_SIZE;x++){
   for(let z=0;z<CHUNK_SIZE;z++){
    const wx=cx*CHUNK_SIZE+x;
    const wz=cz*CHUNK_SIZE+z;
    blockMap.set(blockKey(wx,0,wz),2); // stone
    blockMap.set(blockKey(wx,1,wz),1); // dirt
    blockMap.set(blockKey(wx,2,wz),1); // dirt
    blockMap.set(blockKey(wx,3,wz),0); // grass
   }
  }
 }
}

const boxGeo=new THREE.BoxGeometry(1,1,1);
const matCache=new Map();

function getMat(color){
 if(!matCache.has(color)) matCache.set(color,new THREE.MeshLambertMaterial({color,flatShading:true}));
 return matCache.get(color);
}

function buildChunkMesh(cx,cz){
 const meshes=[];
 for(let x=0;x<CHUNK_SIZE;x++){
  for(let z=0;z<CHUNK_SIZE;z++){
   for(let y=0;y<WORLD_HEIGHT;y++){
    const wx=cx*CHUNK_SIZE+x;
    const wz=cz*CHUNK_SIZE+z;
    const k=blockKey(wx,y,wz);
    if(!blockMap.has(k)) continue;
    const type=blockMap.get(k);
    const m=new THREE.Mesh(boxGeo,getMat(blockTypes[type].color));
    m.position.set(wx+0.5,y+0.5,wz+0.5);
    m.castShadow=true;
    m.receiveShadow=true;
    meshes.push(m);
   }
  }
 }
 return meshes;
}

function rebuildChunk(cx,cz){
 const ck=chunkKey(cx,cz);
 if(chunkMeshes.has(ck)){
  chunkMeshes.get(ck).forEach(m=>{scene.remove(m); if(m.geometry) m.geometry.dispose();});
 }
 const meshes=buildChunkMesh(cx,cz);
 meshes.forEach(m=>scene.add(m));
 chunkMeshes.set(ck,meshes);
}

function loadChunksAround(px,pz){
 const {cx,cz}=getChunkCoords(px,pz);
 const toLoad=new Set();
 for(let x=cx-RENDER_DIST;x<=cx+RENDER_DIST;x++){
  for(let z=cz-RENDER_DIST;z<=cz+RENDER_DIST;z++){
   toLoad.add(chunkKey(x,z));
  }
 }
 const toUnload=[];
 for(const ck of chunkMeshes.keys()){
  if(!toLoad.has(ck)) toUnload.push(ck);
 }
 toUnload.forEach(ck=>{
  chunkMeshes.get(ck).forEach(m=>{scene.remove(m); if(m.geometry) m.geometry.dispose();});
  chunkMeshes.delete(ck);
 });
 toLoad.forEach(ck=>{
  if(!chunkMeshes.has(ck)){
   const [cx,cz]=ck.split(',').map(Number);
   rebuildChunk(cx,cz);
  }
 });
}

load(50,'Setting up input...');

const player={x:0,y:35,z:0,vy:0,jumping:false};
const keys={};

document.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key>='1'&&e.key<='9') selectBlock(Number(e.key)-1);
 if(e.key===' '){
  if(!player.jumping){player.vy=0.7;player.jumping=true;}
  e.preventDefault();
 }
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

let yaw=0,pitch=0;
document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement===canvas){
  yaw-=e.movementX*0.003;
  pitch-=e.movementY*0.003;
  pitch=Math.max(-1.4,Math.min(1.4,pitch));
 }
});

canvas.addEventListener('click',()=>{
 if(document.pointerLockElement!==canvas) canvas.requestPointerLock();
});

canvas.addEventListener('mousedown',e=>{
 if(document.pointerLockElement!==canvas) return;
 
 const forward=Math.sin(yaw);
 const right=Math.cos(yaw);
 const up=Math.sin(pitch);
 const fwd=Math.cos(pitch);

 // Cast a ray 5 blocks forward
 let bx=player.x,by=player.y+1.6,bz=player.z;
 let hit=false;
 for(let i=0;i<10;i++){
  bx+=forward*fwd*0.5;
  by+=up*0.5;
  bz+=Math.cos(yaw)*fwd*0.5;
  
  const k=blockKey(Math.round(bx),Math.round(by),Math.round(bz));
  if(blockMap.has(k)){
   if(e.shiftKey) blockMap.delete(k);
   else blockMap.set(k,selectedBlock);
   
   const {cx,cz}=getChunkCoords(Math.round(bx),Math.round(bz));
   rebuildChunk(cx,cz);
   hit=true;
   break;
  }
 }
 
 if(!hit){
  // Place in front if nothing hit
  bx=Math.round(player.x+forward*fwd*5);
  by=Math.round(player.y+1.6+up*5);
  bz=Math.round(player.z+Math.cos(yaw)*fwd*5);
  blockMap.set(blockKey(bx,by,bz),selectedBlock);
  const {cx,cz}=getChunkCoords(bx,bz);
  rebuildChunk(cx,cz);
 }
});

load(70,'Rendering world...');
loadChunksAround(0,0);

load(90,'Starting game loop...');
let lastTime=Date.now(),fps=0,frameCount=0;
let lastChunkCx=-999,lastChunkCz=-999;

function animate(){
 requestAnimationFrame(animate);
 
 const now=Date.now();
 frameCount++;
 if(now-lastTime>1000){fps=frameCount;frameCount=0;lastTime=now;$('fps').textContent=fps;$('chunks').textContent=chunkMeshes.size;}

 // Movement
 const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 
 if(keys['w']||keys['arrowup']){player.x+=forward.x*0.2;player.z+=forward.z*0.2;}
 if(keys['s']||keys['arrowdown']){player.x-=forward.x*0.2;player.z-=forward.z*0.2;}
 if(keys['a']||keys['arrowleft']){player.x-=right.x*0.2;player.z-=right.z*0.2;}
 if(keys['d']||keys['arrowright']){player.x+=right.x*0.2;player.z+=right.z*0.2;}

 // Gravity
 player.vy-=0.02;
 player.y+=player.vy;
 if(player.y<4){player.y=4;player.vy=0;player.jumping=false;}

 // Update camera
 camera.position.set(player.x,player.y+1.6,player.z);
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 // Load/unload chunks based on position
 const {cx,cz}=getChunkCoords(player.x,player.z);
 if(cx!==lastChunkCx||cz!==lastChunkCz){
  lastChunkCx=cx;lastChunkCz=cz;
  loadChunksAround(player.x,player.z);
 }

 renderer.render(scene,camera);
}

load(100,'Ready to play!');
setTimeout(()=>$('loadingScreen').style.display='none',600);
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
