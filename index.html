<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .loading-bar-container {
            width: 300px;
            height: 30px;
            background: #333;
            border: 2px solid #00ff00;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 5px;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00cc00);
            width: 0%;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px #00ff00;
        }

        .loading-text {
            font-size: 18px;
            color: #aaa;
        }

        .loading-percentage {
            font-size: 24px;
            color: #00ff00;
            margin-top: 15px;
            font-weight: bold;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
        }

        #hud div {
            margin: 5px 0;
        }

        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #888;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(9, 40px);
            gap: 5px;
            border-radius: 5px;
            z-index: 100;
        }

        .inventory-slot {
            width: 40px;
            height: 40px;
            background: rgba(100, 100, 100, 0.8);
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            border-radius: 3px;
        }

        .inventory-slot.selected {
            border: 2px solid #FFD700;
            background: rgba(150, 150, 150, 0.8);
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loading-content">
            <div class="loading-title">🎮 MINECRAFT 3D</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <div class="loading-text" id="loadingText">Initializing...</div>
            <div class="loading-percentage" id="loadingPercent">0%</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div>FPS: <span id="fps">0</span></div>
        <div>Blocks Rendered: <span id="blocksRendered">0</span></div>
        <div>Position: X:<span id="posX">0</span> Y:<span id="posY">0</span> Z:<span id="posZ">0</span></div>
    </div>

    <div id="inventory">
        <div class="inventory-slot selected">Grass</div>
        <div class="inventory-slot">Dirt</div>
        <div class="inventory-slot">Stone</div>
        <div class="inventory-slot">Sand</div>
        <div class="inventory-slot">Wood</div>
        <div class="inventory-slot">Leaves</div>
        <div class="inventory-slot">Glass</div>
        <div class="inventory-slot">Cobble</div>
        <div class="inventory-slot">Coal</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ===== LOADING SCREEN =====
        let loadingProgress = 0;
        function updateLoading(percent, text) {
            loadingProgress = percent;
            document.getElementById('loadingBar').style.width = percent + '%';
            document.getElementById('loadingPercent').textContent = Math.floor(percent) + '%';
            document.getElementById('loadingText').textContent = text;
        }

        updateLoading(10, 'Setting up Three.js...');

        // ===== THREE.JS SETUP =====
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 200, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 32, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        updateLoading(25, 'Creating lighting...');

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 100);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        updateLoading(40, 'Generating world...');

        // ===== BLOCK SYSTEM =====
        const blockSize = 1;
        const chunkSize = 16;
        const worldHeight = 4;
        const chunks = {};
        const chunkMeshes = {};
        const renderDistance = 5;

        const blockMaterials = {
            grass_top: new THREE.MeshLambertMaterial({ color: 0x2D5016 }),
            grass_side: new THREE.MeshLambertMaterial({ color: 0x3a6b1f }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x8B7355 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x808080 }),
            sand: new THREE.MeshLambertMaterial({ color: 0xF4A460 })
        };

        function getChunkKey(cx, cz) {
            return `${cx},${cz}`;
        }

        function generateChunk(cx, cz) {
            const blocks = [];
            const startX = cx * chunkSize;
            const startZ = cz * chunkSize;

            for (let y = 0; y < worldHeight; y++) {
                for (let x = 0; x < chunkSize; x++) {
                    for (let z = 0; z < chunkSize; z++) {
                        let blockType = 'dirt';
                        if (y === worldHeight - 1) blockType = 'grass_top';
                        if (y === 0) blockType = 'stone';

                        blocks.push({
                            x: startX + x,
                            y: y,
                            z: startZ + z,
                            type: blockType
                        });
                    }
                }
            }

            return blocks;
        }

        function createChunkMesh(cx, cz) {
            const key = getChunkKey(cx, cz);
            
            if (!chunks[key]) {
                chunks[key] = generateChunk(cx, cz);
            }

            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const normals = [];
            const colors = [];

            const blocks = chunks[key];

            for (let block of blocks) {
                const x = block.x;
                const y = block.y;
                const z = block.z;

                // Color based on type
                let color;
                if (block.type === 'grass_top') color = new THREE.Color(0x2D5016);
                else if (block.type === 'grass_side') color = new THREE.Color(0x3a6b1f);
                else if (block.type === 'dirt') color = new THREE.Color(0x8B7355);
                else if (block.type === 'stone') color = new THREE.Color(0x808080);
                else color = new THREE.Color(0xF4A460);

                // Add box geometry
                const vertices = [
                    // Front
                    x, y, z,
                    x + blockSize, y, z,
                    x + blockSize, y + blockSize, z,
                    x, y + blockSize, z,
                    // Back
                    x, y, z + blockSize,
                    x + blockSize, y, z + blockSize,
                    x + blockSize, y + blockSize, z + blockSize,
                    x, y + blockSize, z + blockSize,
                    // Top
                    x, y + blockSize, z,
                    x + blockSize, y + blockSize, z,
                    x + blockSize, y + blockSize, z + blockSize,
                    x, y + blockSize, z + blockSize,
                    // Bottom
                    x, y, z,
                    x + blockSize, y, z,
                    x + blockSize, y, z + blockSize,
                    x, y, z + blockSize,
                    // Right
                    x + blockSize, y, z,
                    x + blockSize, y, z + blockSize,
                    x + blockSize, y + blockSize, z + blockSize,
                    x + blockSize, y + blockSize, z,
                    // Left
                    x, y, z,
                    x, y, z + blockSize,
                    x, y + blockSize, z + blockSize,
                    x, y + blockSize, z
                ];

                // Add vertices
                for (let i = 0; i < vertices.length; i += 3) {
                    positions.push(vertices[i], vertices[i + 1], vertices[i + 2]);
                    colors.push(color.r, color.g, color.b);
                }

                // Add indices and normals
                const indexOffset = positions.length / 3 - 24;
                
                // Simple normals (pointing outward from cube)
                const faceNormals = [
                    [0, 0, -1], [0, 0, 1], [0, 1, 0], [0, -1, 0],
                    [1, 0, 0], [-1, 0, 0]
                ];

                for (let face = 0; face < 6; face++) {
                    const [nx, ny, nz] = faceNormals[face];
                    for (let i = 0; i < 4; i++) {
                        normals.push(nx, ny, nz);
                    }
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
            geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(normals), 3));

            const material = new THREE.MeshLambertMaterial({
                vertexColors: true,
                side: THREE.DoubleSide
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            return mesh;
        }

        updateLoading(60, 'Loading chunks...');

        // Generate initial chunks
        for (let cx = -renderDistance; cx <= renderDistance; cx++) {
            for (let cz = -renderDistance; cz <= renderDistance; cz++) {
                const mesh = createChunkMesh(cx, cz);
                chunkMeshes[getChunkKey(cx, cz)] = mesh;
                scene.add(mesh);
            }
        }

        updateLoading(85, 'Setting up controls...');

        // ===== PLAYER MOVEMENT =====
        const player = {
            position: new THREE.Vector3(0, 32, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            isJumping: false,
            speed: 0.2,
            jumpForce: 0.8,
            gravity: 0.02
        };

        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (!player.isJumping) {
                    player.velocity.y = player.jumpForce;
                    player.isJumping = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Mouse look
        let yaw = 0;
        let pitch = 0;
        const maxPitch = Math.PI / 2.5;

        document.addEventListener('mousemove', (e) => {
            const sensitivity = 0.003;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));
        });

        document.addEventListener('click', () => {
            canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
            canvas.requestPointerLock();
        });

        updateLoading(100, 'Ready to play!');

        // ===== GAME LOOP =====
        let lastTime = Date.now();
        let frameCount = 0;
        let fps = 0;

        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';

            function animate() {
                requestAnimationFrame(animate);

                const now = Date.now();
                const dt = Math.min((now - lastTime) / 1000, 0.016);
                lastTime = now;

                // Movement
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                if (keys['w'] || keys['arrowup']) player.position.addScaledVector(forward, player.speed);
                if (keys['s'] || keys['arrowdown']) player.position.addScaledVector(forward, -player.speed);
                if (keys['a'] || keys['arrowleft']) player.position.addScaledVector(right, -player.speed);
                if (keys['d'] || keys['arrowright']) player.position.addScaledVector(right, player.speed);

                // Gravity
                player.velocity.y -= player.gravity;
                player.position.y += player.velocity.y;

                // Ground collision (simple)
                if (player.position.y < 32) {
                    player.position.y = 32;
                    player.velocity.y = 0;
                    player.isJumping = false;
                }

                // Boundary checks
                if (player.position.x < -100) player.position.x = -100;
                if (player.position.x > 100) player.position.x = 100;
                if (player.position.z < -100) player.position.z = -100;
                if (player.position.z > 100) player.position.z = 100;

                // Update camera
                camera.position.copy(player.position);
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;

                // Chunk loading/unloading
                const playerChunkX = Math.floor(player.position.x / chunkSize);
                const playerChunkZ = Math.floor(player.position.z / chunkSize);

                for (let cx = playerChunkX - renderDistance; cx <= playerChunkX + renderDistance; cx++) {
                    for (let cz = playerChunkZ - renderDistance; cz <= playerChunkZ + renderDistance; cz++) {
                        const key = getChunkKey(cx, cz);
                        if (!chunkMeshes[key]) {
                            const mesh = createChunkMesh(cx, cz);
                            chunkMeshes[key] = mesh;
                            scene.add(mesh);
                        }
                    }
                }

                // Unload distant chunks
                const keysToRemove = [];
                for (let key in chunkMeshes) {
                    const [cx, cz] = key.split(',').map(Number);
                    const dist = Math.sqrt(Math.pow(cx - playerChunkX, 2) + Math.pow(cz - playerChunkZ, 2));
                    if (dist > renderDistance + 1) {
                        scene.remove(chunkMeshes[key]);
                        chunkMeshes[key].geometry.dispose();
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(key => delete chunkMeshes[key]);

                // Update HUD
                frameCount++;
                if (now - lastTime > 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastTime = now;
                }

                document.getElementById('fps').textContent = fps;
                document.getElementById('blocksRendered').textContent = Object.keys(chunkMeshes).length;
                document.getElementById('posX').textContent = Math.floor(player.position.x);
                document.getElementById('posY').textContent = Math.floor(player.position.y);
                document.getElementById('posZ').textContent = Math.floor(player.position.z);

                renderer.render(scene, camera);
            }

            animate();
        }, 1500);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
