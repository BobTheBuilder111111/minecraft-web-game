<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple 3D Minecraft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}
#loadingScreen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#16213e;color:#fff;text-align:center}
.loading-title{font-size:42px;color:#0f0;margin-bottom:24px}.bar{width:320px;height:24px;background:#222;border:2px solid #0f0;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#0f0,#0a0)}#loadingText{margin-top:12px;font-size:16px}#loadingPercent{margin-top:8px;font-size:18px;color:#0f0;font-weight:700}
#hud{position:fixed;top:10px;left:10px;z-index:2;padding:10px;color:#fff;background:#0008;font:14px monospace;line-height:1.5}#hud b{color:#ff0}
#inventory{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(9,52px);gap:6px;padding:10px;background:#0008;border:2px solid #6a6a6a;border-radius:8px;z-index:2}
.slot{appearance:none;border:2px solid #444;background:#777;width:52px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:#fff;font-weight:700;border-radius:4px}
.slot.selected{border-color:#ffd700;box-shadow:0 0 10px #ffd700;background:#a3a3a3}.slot .color{position:absolute;inset:7px 7px 18px 7px;border-radius:4px}.slot .name{position:absolute;bottom:4px;left:0;right:0;font-size:9px;text-align:center}.slot .key{position:absolute;top:4px;right:5px;font-size:8px;color:#ddd}
#selectedInfo{position:fixed;top:10px;right:10px;z-index:2;padding:10px 12px;background:#0008;border:2px solid #0f0;border-radius:8px;color:#0f0;font:14px monospace;text-align:center}
#selectedSwatch{width:48px;height:48px;border:2px solid #0f0;border-radius:6px;margin:8px auto;background:#2d5016}
#selectedName{font-size:16px;margin-top:8px}
</style>
</head>
<body>
<div id="loadingScreen"><div><div class="loading-title">🎮 MINECRAFT 3D</div><div class="bar"><div id="loadingBar"></div></div><div id="loadingText">Starting 3D engine...</div><div id="loadingPercent">0%</div></div></div>
<canvas id="gameCanvas"></canvas>
<div id="hud">WASD: move | Mouse: look | Space: jump<br>Click: place block | Shift-click: remove<br>Selected: <b id="selectedNameHUD">Grass</b><br>Chunks: <span id="chunks">0</span> | Render dist: <span id="renderDist">6</span></div>
<div id="selectedInfo"><div>Selected Block</div><div id="selectedSwatch"></div><div id="selectedName">Grass</div></div>
<div id="inventory"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), bar=$('loadingBar');
function load(n,t){bar.style.width=n+'%';$('loadingPercent').textContent=n+'%';$('loadingText').textContent=t}
load(10,'Creating WebGL renderer...');
const canvas=$('gameCanvas'), scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,120,280);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,500), renderer=new THREE.WebGLRenderer({canvas,antialias:false}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,1)); const sun=new THREE.DirectionalLight(0xffffff,.8); sun.position.set(80,120,60); scene.add(sun);
load(25,'Preparing block types...');
const types=[
 {name:'Grass', color:0x2d5016},
 {name:'Dirt', color:0x8b5a35},
 {name:'Stone', color:0x808080},
 {name:'Sand', color:0xe6c27a},
 {name:'Wood', color:0x79502b},
 {name:'Leaves', color:0x258a35},
 {name:'Glass', color:0xadd8e6},
 {name:'Cobble', color:0x6b6b6b},
 {name:'Coal', color:0x1a1a1a}
];
let selected=0;
const inventory=$('inventory'); const slotEls=[];
for(let i=0;i<types.length;i++){
  const t=types[i];
  const btn=document.createElement('button');
  btn.className='slot'+(i===selected?' selected':'');
  btn.innerHTML='<span class="color" style="background:#'+t.color.toString(16).padStart(6,'0')+'"></span><span class="name">'+t.name+'</span><span class="key">'+(i+1)+'</span>';
  btn.addEventListener('click',()=>setSelected(i));
  inventory.appendChild(btn); slotEls.push(btn);
}
function setSelected(i){
 selected=i; for(const [idx,slot] of slotEls.entries()) slot.classList.toggle('selected', idx===i);
 const t=types[selected];
 $('selectedSwatch').style.background='#'+t.color.toString(16).padStart(6,'0');
 $('selectedName').textContent=t.name;
 $('selectedNameHUD').textContent=t.name;
}
setSelected(0);
load(35,'Creating world geometry...');
const chunkSize=16, worldHeight=4, renderDistance=6, world=new Map(), groups=new Map();
const cube=new THREE.BoxGeometry(1,1,1); const materialCache=new Map();
function materialFor(color){
  if(!materialCache.has(color)) materialCache.set(color, new THREE.MeshLambertMaterial({color, transparent:true, opacity:.96}));
  return materialCache.get(color);
}
function key(x,y,z){return x+','+y+','+z}
function ckey(x,z){return x+','+z}
function blockAt(x,y,z){return world.get(key(x,y,z));}
function setBlock(x,y,z,type){
  if(type===null) world.delete(key(x,y,z)); else world.set(key(x,y,z), type);
  const cx=Math.floor(x/chunkSize), cz=Math.floor(z/chunkSize);
  if(groups.has(ckey(cx,cz))) rebuild(cx,cz);
}
function makeChunk(cx,cz){
  const group=new THREE.Group();
  const chunkBlocks=[];
  for(let x=0;x<chunkSize;x++) for(let z=0;z<chunkSize;z++) for(let y=0;y<worldHeight;y++){
    const wx=cx*chunkSize+x, wz=cz*chunkSize+z;
    let type=blockAt(wx,y,wz);
    if(type===undefined){
      if(y===worldHeight-1) type=0; else if(y===0) type=2; else continue;
    }
    chunkBlocks.push({x:wx,y,z:wz,type});
  }
  for(const b of chunkBlocks){
    const t=types[b.type] || types[0];
    const mesh=new THREE.Mesh(cube, materialFor(t.color));
    mesh.position.set(b.x+0.5, b.y+0.5, b.z+0.5);
    group.add(mesh);
  }
  return group;
}
function rebuild(cx,cz){
  const k=ckey(cx,cz), old=groups.get(k); if(old){ scene.remove(old); old.traverse(o=>{if(o.geometry) o.geometry.dispose(); if(o.material && !Array.isArray(o.material)) o.material.dispose();}); groups.delete(k); }
  const fresh=makeChunk(cx,cz); groups.set(k,fresh); scene.add(fresh);
}
function ensureWorld(){
  for(let x=-renderDistance;x<=renderDistance;x++) for(let z=-renderDistance;z<=renderDistance;z++){
    const k=ckey(x,z); if(!groups.has(k)){ const chunkX=x*chunkSize, chunkZ=z*chunkSize; for(let bx=0;bx<chunkSize;bx++) for(let bz=0;bz<chunkSize;bz++) for(let y=0;y<worldHeight;y++){
      const wx=chunkX+bx, wz=chunkZ+bz; let t = (y===worldHeight-1)?0:(y===0?2:1); world.set(key(wx,y,wz), t);
    } rebuild(x,z); }
  }
}
let player={x:0,y:32,z:0,vy:0,jumping:false}; const keys={}; let yaw=0,pitch=0;
addEventListener('keydown',e=>{const k=e.key.toLowerCase(); keys[k]=true; if(e.key>='1'&&e.key<='9') setSelected(Number(e.key)-1); if(k===' '&&!player.jumping){player.vy=.75; player.jumping=true;}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){ yaw-=e.movementX*.003; pitch-=e.movementY*.003; pitch=Math.max(-1.4,Math.min(1.4,pitch)); }});
canvas.addEventListener('click',()=>canvas.requestPointerLock());
canvas.addEventListener('mousedown',e=>{
  if(document.pointerLockElement!==canvas) return;
  const dir=new THREE.Vector3(Math.sin(yaw), Math.sin(pitch), Math.cos(yaw)).normalize();
  const origin=new THREE.Vector3(player.x,player.y+1.2,player.z);
  const ray=new THREE.Raycaster(origin, dir, 0, 6);
  const hits = ray.intersectObjects([...groups.values()].flatMap(g=>g.children), true);
  if(!hits.length){
    const bx=Math.round(player.x + dir.x * 4), by=Math.round(player.y + dir.y * 4), bz=Math.round(player.z + dir.z * 4);
    setBlock(bx,by,bz,selected);
    return;
  }
  const hit=hits[0];
  const normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const bx=Math.round(hit.point.x - normal.x*0.6), by=Math.round(hit.point.y - normal.y*0.6), bz=Math.round(hit.point.z - normal.z*0.6);
  if(e.shiftKey){ setBlock(bx,by,bz,null); }
  else { setBlock(bx,by,bz,selected); }
});
load(55,'Generating nearby chunks...'); ensureWorld();
load(80,'Loading controls...');
let last=performance.now(), frames=0, fps=0;
function animate(now){
  requestAnimationFrame(animate);
  const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  if(keys['w']||keys['arrowup']){ player.x += forward.x * .18; player.z += forward.z * .18; }
  if(keys['s']||keys['arrowdown']){ player.x -= forward.x * .18; player.z -= forward.z * .18; }
  if(keys['a']||keys['arrowleft']){ player.x -= right.x * .18; player.z -= right.z * .18; }
  if(keys['d']||keys['arrowright']){ player.x += right.x * .18; player.z += right.z * .18; }
  player.vy -= .015; player.y += player.vy; if(player.y<32){player.y=32;player.vy=0;player.jumping=false;}
  camera.position.set(player.x, player.y+1.6, player.z);
  camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
  const px=Math.floor(player.x/chunkSize), pz=Math.floor(player.z/chunkSize);
  for(let x=px-renderDistance;x<=px+renderDistance;x++) for(let z=pz-renderDistance;z<=pz+renderDistance;z++){
    const k=ckey(x,z); if(!groups.has(k)){ rebuild(x,z); }
  }
  for(const k of [...groups.keys()]){ const [x,z]=k.split(',').map(Number); if(Math.abs(x-px)>renderDistance+1 || Math.abs(z-pz)>renderDistance+1){ const g=groups.get(k); if(g){ scene.remove(g); g.traverse(o=>{if(o.geometry) o.geometry.dispose(); if(o.material && !Array.isArray(o.material)) o.material.dispose();}); groups.delete(k);} } }
  frames++; if(now-last>=1000){ fps=frames; frames=0; last=now; }
  $('chunks').textContent=groups.size; $('renderDist').textContent=renderDistance;
  renderer.render(scene,camera);
}
load(100,'Ready to play!'); setTimeout(()=>$('loadingScreen').style.display='none',500); requestAnimationFrame(animate);
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
