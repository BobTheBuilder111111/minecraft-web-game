<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple 3D Minecraft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}
#loadingScreen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#16213e;color:#fff;text-align:center}.loading-title{font-size:42px;color:#0f0;margin-bottom:24px}.bar{width:300px;height:24px;border:2px solid #0f0}.bar>div{height:100%;width:0;background:#0c0}#loadingText{margin:15px;color:#bbb}
#hud{position:fixed;top:10px;left:10px;z-index:2;padding:10px;color:#fff;background:#0008;font:14px monospace;line-height:1.5}#inventory{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:5px;padding:8px;background:#000b;border:2px solid #888;border-radius:5px}.slot{width:58px;height:44px;color:#fff;background:#555c;border:2px solid #333;border-radius:3px;font-size:11px;cursor:pointer}.slot.selected{border-color:#ffd700;background:#888c}.swatch{display:block;width:18px;height:12px;margin:3px auto;border:1px solid #111}
</style></head>
<body>
<div id="loadingScreen"><div><div class="loading-title">🎮 MINECRAFT 3D</div><div class="bar"><div id="loadingBar"></div></div><div id="loadingText">Starting 3D engine...</div><b id="loadingPercent">0%</b></div></div>
<canvas id="gameCanvas"></canvas>
<div id="hud">WASD: move | Mouse: look | Space: jump<br>Click: place block | Shift-click: remove<br>Selected: <span id="selectedName">Grass</span><br>Chunks: <span id="chunks">0</span> | Render distance: 6</div>
<div id="inventory"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), bar=$('loadingBar');
function load(n,t){bar.style.width=n+'%';$('loadingPercent').textContent=n+'%';$('loadingText').textContent=t}
load(10,'Creating WebGL renderer...');
const canvas=$('gameCanvas'),scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,120,280);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({canvas,antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,1));const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(80,120,60);scene.add(sun);load(25,'Preparing block types...');
const types=[{name:'Grass',color:0x3b8f2f},{name:'Dirt',color:0x8b5a35},{name:'Stone',color:0x808080},{name:'Sand',color:0xe6c27a},{name:'Wood',color:0x79502b},{name:'Leaves',color:0x258a35},{name:'Glass',color:0x8ed8e8},{name:'Cobble',color:0x666666},{name:'Coal',color:0x222222}];
let selected=0;const inventory=$('inventory');const slotEls=[];types.forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(i===0?' selected':'');b.innerHTML='<span class="swatch" style="background:#'+t.color.toString(16).padStart(6,'0')+'"></span>'+t.name;b.onclick=e=>{e.stopPropagation();select(i)};inventory.appendChild(b);slotEls.push(b)});function select(i){selected=(i+types.length)%types.length;slotEls.forEach((b,n)=>b.classList.toggle('selected',n===selected));$('selectedName').textContent=types[selected].name}
const chunkSize=16,worldHeight=4,renderDistance=6,world=new Map(),groups=new Map();const cube=new THREE.BoxGeometry(1,1,1);const mats=types.map(t=>new THREE.MeshLambertMaterial({color:t.color,transparent:t.name==='Glass',opacity:t.name==='Glass'?.45:1}));
function key(x,y,z){return x+','+y+','+z}function ckey(x,z){return x+','+z}
function blockAt(x,y,z){return world.get(key(x,y,z));}
function setBlock(x,y,z,type){if(type===null)world.delete(key(x,y,z));else world.set(key(x,y,z),type);const cx=Math.floor(x/chunkSize),cz=Math.floor(z/chunkSize);if(groups.has(ckey(cx,cz)))rebuild(cx,cz)}
function makeChunk(cx,cz){const group=new THREE.Group();const faces=[[],[],[],[],[],[]];for(let x=0;x<chunkSize;x++)for(let z=0;z<chunkSize;z++)for(let y=0;y<worldHeight;y++){let type=blockAt(cx*chunkSize+x,y,cz*chunkSize+z);if(type===undefined){if(y===0)type=2;else if(y===3)type=0;else type=1}faces[type].push({x:cx*chunkSize+x,y,z:cz*chunkSize+z})}for(let type=0;type<types.length;type++){const blocks=faces[type];if(!blocks.length)continue;const mesh=new THREE.InstancedMesh(cube,mats[type],blocks.length);const m=new THREE.Matrix4();blocks.forEach((b,i)=>{m.makeTranslation(b.x+.5,b.y+.5,b.z+.5);mesh.setMatrixAt(i,m)});mesh.instanceMatrix.needsUpdate=true;mesh.userData.blocks=blocks;mesh.userData.type=type;group.add(mesh)}scene.add(group);groups.set(ckey(cx,cz),group)}
function rebuild(cx,cz){const k=ckey(cx,cz);const old=groups.get(k);if(old){scene.remove(old);groups.delete(k);old.traverse(o=>{if(o.geometry) o.geometry.dispose(); if(o.material && !Array.isArray(o.material)) o.material.dispose();})}makeChunk(cx,cz)}
function ensureChunks(){const px=Math.floor(player.x/chunkSize),pz=Math.floor(player.z/chunkSize);for(let x=px-renderDistance;x<=px+renderDistance;x++)for(let z=pz-renderDistance;z<=pz+renderDistance;z++)if(!groups.has(ckey(x,z)))makeChunk(x,z);for(const [k,g] of groups){const [x,z]=k.split(',').map(Number);if(Math.hypot(x-px,z-pz)>renderDistance+1){scene.remove(g);g.traverse(o=>{if(o.geometry) o.geometry.dispose(); if(o.material && !Array.isArray(o.material)) o.material.dispose();});groups.delete(k)}}$('chunks').textContent=groups.size}
load(55,'Generating nearby chunks...');
const player={x:0,y:32,z:0,vy:0,jumping:false},keys={},ray=new THREE.Raycaster();let yaw=0,pitch=0;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(e.key>='1'&&e.key<='9')select(Number(e.key)-1);if(k===' '&&!player.jumping){player.vy=.8;player.jumping=true}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){yaw-=e.movementX*.003;pitch-=e.movementY*.003;pitch=Math.max(-1.4,Math.min(1.4,pitch))}});
canvas.addEventListener('click',()=>canvas.requestPointerLock());
canvas.addEventListener('mousedown',e=>{if(document.pointerLockElement!==canvas)return;const hit=ray.intersectObjects([...groups.values()].flatMap(g=>g.children),true)[0];if(!hit||hit.instanceId===undefined)return;const object=hit.object,blocks=object.userData.blocks,b=blocks[hit.instanceId];let tx=b.x,ty=b.y,tz=b.z;if(e.shiftKey){setBlock(tx,ty,tz,null)}else{const normal=hit.face.normal;tx+=Math.round(normal.x);ty+=Math.round(normal.y);tz+=Math.round(normal.z);if(ty<0||ty>20)return;setBlock(tx,ty,tz,selected)};const cx=Math.floor(tx/chunkSize),cz=Math.floor(tz/chunkSize);rebuild(cx,cz);});
load(80,'Loading controls...');ensureChunks();load(100,'Ready to play!');setTimeout(()=>$('loadingScreen').style.display='none',700);
let last=performance.now(),frames=0,fps=0,fpsTime=last;function animate(now){requestAnimationFrame(animate);const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));if(keys.w||keys.arrowup){player.x+=forward.x*.2;player.z+=forward.z*.2}if(keys.s||keys.arrowdown){player.x-=forward.x*.2;player.z-=forward.z*.2}if(keys.a||keys.arrowleft){player.x-=right.x*.2;player.z-=right.z*.2}if(keys.d||keys.arrowright){player.x+=right.x*.2;player.z+=right.z*.2}player.vy-=.03;player.y+=player.vy;if(player.y<4){player.y=4;player.vy=0;player.jumping=false}camera.position.set(player.x,player.y,player.z);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;ensureChunks();ray.setFromCamera({x:0,y:0},camera);$('selectedName').textContent=types[selected].name;renderer.render(scene,camera);frames++;if(now-fpsTime>1000){fps=frames;frames=0;fpsTime=now}}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
